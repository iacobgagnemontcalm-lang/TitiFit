# Déploie la version web sur GitHub Pages à chaque push sur la branche par
# défaut. Depuis n'importe quelle autre branche, le déclenchement manuel
# (Actions → Run workflow) fait le même travail.
#
# Prérequis côté dépôt : *Settings → Pages → Source* doit être sur **GitHub
# Actions**. En mode « Deploy from a branch », Pages publie les fichiers du
# dépôt tels quels — donc le README, pas l'app — et ce workflow échoue.
#
# Alternative à Firebase Hosting (voir README). Trois particularités de Pages
# sont traitées ici :
#   1. le site est servi sous /TitiFit/, pas à la racine → EXPO_BASE_URL ;
#   2. Pages n'a pas de règles de réécriture → index.html est copié en
#      404.html, ce qui fait retomber toutes les routes sur l'app ;
#   3. Jekyll ignore les dossiers commençant par "_" → .nojekyll, sinon tout
#      le dossier _expo (donc le bundle entier) disparaît silencieusement.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [claude/athlete-profile-gamified-app-jhc9en]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Un build sans clés se déploie quand même, mais en mode local : ni
      # comptes ni synchronisation, et l'app affiche un bandeau à l'ouverture.
      # C'est un choix volontaire — mieux vaut un site debout qu'un déploiement
      # rouge — mais ça ne doit pas passer inaperçu dans le journal.
      - name: Vérifier les clés Firebase
        env:
          API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
        run: |
          missing=""
          [ -n "$API_KEY" ] || missing="$missing EXPO_PUBLIC_FIREBASE_API_KEY"
          [ -n "$APP_ID" ] || missing="$missing EXPO_PUBLIC_FIREBASE_APP_ID"
          if [ -n "$missing" ]; then
            echo "::warning title=Firebase non configuré::Secrets manquants :$missing — le site se déploiera en mode local, sans comptes ni synchronisation."
          else
            echo "Clés Firebase présentes : le build aura les comptes et la synchronisation."
          fi

      - name: Export web
        env:
          EXPO_BASE_URL: /TitiFit
          # Les clés Firebase sont inlinées au build. Elles sont publiques par
          # conception (la sécurité vient des règles Firestore/Storage), mais
          # elles passent par les secrets du dépôt pour rester modifiables
          # sans toucher au code.
          #
          # Les trois valeurs ci-dessous se déduisent de l'ID de projet et sont
          # déjà versionnées dans .firebaserc et .env.example : les mettre par
          # défaut ne divulgue rien et ramène à DEUX le nombre de secrets à
          # créer pour que les comptes marchent (API_KEY et APP_ID). Un secret
          # défini l'emporte, ce qui laisse la porte ouverte à un autre projet.
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID || 'titifit-ff0a6' }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN || 'titifit-ff0a6.firebaseapp.com' }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET || 'titifit-ff0a6.firebasestorage.app' }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
        run: npm run build:web

      - name: Préparer pour GitHub Pages
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
